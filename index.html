<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>To my best friends</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient-glow glow-one" aria-hidden="true"></div>
<div class="ambient-glow glow-two" aria-hidden="true"></div>
<div id="sparkles" class="sparkles" aria-hidden="true"></div>


<audio id="backgroundMusic" src="music.mp3" autoplay loop preload="auto" playsinline></audio>

<main class="page">
  <section class="chat-card" aria-label="My best friends">
    <div class="music-control-row"><button id="musicToggle" class="music-toggle" type="button" aria-pressed="false" aria-label="التحكم في الموسيقى"><span class="music-symbol" aria-hidden="true">♫</span><span id="musicToggleLabel">بدأ</span></button></div>
    <div class="chat-row">
      <img class="avatar" src="pin.png" alt="الصورة الشخصية">
      <div class="message-bubble">
        <div class="bubble-meta"><span class="sender">Tuqa Sayed 💕</span><span class="online-dot" aria-hidden="true"></span></div>
        <div id="message" class="message"></div>
        <div class="bubble-footer" aria-hidden="true"><span>♡</span><i></i><span>✦</span></div>
      </div>
    </div>
  </section>
</main>
<script src="script.js?v=8"></script>
</body>
</html>
